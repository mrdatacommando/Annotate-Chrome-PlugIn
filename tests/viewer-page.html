<body>

<!-- The DOM viewer.html provides. A bare file:// load of viewer.html cannot
     work: it has no chrome.* and nothing to read a session from. -->
<div class="wrap" id="app">Loading…</div>
<div id="checks">pending</div>

<script>
  window.__errors = [];
  window.onerror = function (m, s, l, c) {
    window.__errors.push(m + ' @' + (s || '?').split('/').pop() + ':' + l + ':' + c);
  };

  const mem = {};
  window.chrome = {
    storage: {
      local: {
        async get(k) {
          if (k === null) return JSON.parse(JSON.stringify(mem));
          const keys = Array.isArray(k) ? k : [k];
          const out = {};
          keys.forEach((key) => { if (key in mem) out[key] = JSON.parse(JSON.stringify(mem[key])); });
          return out;
        },
        async set(o) { Object.keys(o).forEach((k) => { mem[k] = JSON.parse(JSON.stringify(o[k])); }); },
        async remove(keys) { (Array.isArray(keys) ? keys : [keys]).forEach((k) => { delete mem[k]; }); },
        async getBytesInUse() { return 0; }
      },
      onChanged: { addListener() {} }
    },
    runtime: { id: 'test', sendMessage: async () => ({ ok: true }), lastError: null },
    downloads: { download: async () => 1 }
  };

  const PNG =
    'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJ' +
    'AAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==';

  /* Two pages. The shots are the interesting part:
   *   sh_shared  - used by TWO annotations, because autoCapture reuses a
   *                recent picture rather than taking the same one twice
   *   sh_solo    - used by one annotation only
   *   sh_orphan  - a screenshot taken on its own, belonging to no annotation */
  mem.at_session = {
    id: 's_v', author: 'Mark', startedAt: '2026-09-06T09:00:00.000Z',
    endedAt: '2026-09-06T09:30:00.000Z', active: false,
    pages: [
      {
        url: 'https://example.com/pricing', title: 'Pricing',
        viewport: { w: 1280, h: 800, dpr: 2 }, visitedAt: '2026-09-06T09:01:00.000Z',
        annotations: [
          { id: 'a1', type: 'highlight', color: '#f4c430', author: 'Mark',
            text: 'Free forever', comment: 'Not true', unplaced: false,
            createdAt: '2026-09-06T09:02:00.000Z',
            anchor: { kind: 'quote', selector: 'main > p',
                      quote: { prefix: 'is ', exact: 'Free forever', suffix: ' for' } },
            shotId: 'sh_shared', rect: { x: 300, y: 1250, w: 90, h: 18 } },
          { id: 'a2', type: 'note', color: '#ff8a3d', author: 'Mark',
            text: 'Nav overlaps at 1280px', comment: '', unplaced: false,
            createdAt: '2026-09-06T09:03:00.000Z',
            anchor: { kind: 'point', selector: 'body', offset: { x: 4, y: 9 } },
            shotId: 'sh_shared', rect: { x: 40, y: 60, w: 200, h: 60 } },
          { id: 'a3', type: 'box', color: '#4aa3f0', author: 'Mark',
            text: 'wrong logo', comment: '', unplaced: false,
            createdAt: '2026-09-06T09:04:00.000Z',
            anchor: { kind: 'point', selector: 'body', offset: { x: 8, y: 8 } },
            shotId: 'sh_solo', rect: { x: 10, y: 10, w: 50, h: 50 } }
        ]
      },
      {
        url: 'https://example.com/about', title: 'About',
        viewport: { w: 1280, h: 800, dpr: 2 }, visitedAt: '2026-09-06T09:20:00.000Z',
        annotations: [
          { id: 'b1', type: 'arrow', color: '#4aa3f0', author: 'Mark',
            text: 'points at nothing', comment: '', unplaced: true,
            createdAt: '2026-09-06T09:21:00.000Z', anchor: null,
            shotId: 'sh_about', rect: { x: 5, y: 5, w: 30, h: 30 } }
        ]
      }
    ],
    shots: [
      { id: 'sh_shared', pageUrl: 'https://example.com/pricing', note: 'shared' },
      { id: 'sh_solo', pageUrl: 'https://example.com/pricing', note: 'solo' },
      { id: 'sh_orphan', pageUrl: 'https://example.com/pricing', note: 'taken on its own' },
      { id: 'sh_about', pageUrl: 'https://example.com/about', note: 'about page' }
    ]
  };
  ['sh_shared', 'sh_solo', 'sh_orphan', 'sh_about'].forEach((id) => {
    mem['at_shot_' + id] = PNG;
  });
</script>

<script src="../core/store.js"></script>
<script src="../core/session.js"></script>
<script src="../core/zip.js"></script>
<script src="../core/report.js"></script>
<script src="../core/folder.js"></script>
<script src="../viewer/viewer.js"></script>

<script>
(async function () {
  const lines = [];
  function flush() { document.getElementById('checks').textContent = lines.join('\n'); }
  function check(label, ok, detail) {
    lines.push((ok ? 'PASS ' : 'FAIL ') + label + (detail ? ' :: ' + detail : ''));
    flush();
  }
  const tick = (ms) => new Promise((r) => setTimeout(r, ms || 40));
  const app = document.getElementById('app');

  const session = () => mem.at_session;
  const page = (url) => (session().pages || []).find((p) => p.url === url);
  const shotIds = () => (session().shots || []).map((s) => s.id).sort().join(',');
  const pixelKeys = () => Object.keys(mem).filter((k) => k.indexOf('at_shot_') === 0)
    .map((k) => k.slice('at_shot_'.length)).sort().join(',');

  /* Finds a row by the annotation content shown in it, then a button in it. */
  function rowFor(textContent) {
    return Array.from(document.querySelectorAll('tr'))
      .find((tr) => tr.textContent.indexOf(textContent) > -1);
  }
  function buttonIn(root, label) {
    return Array.from(root.querySelectorAll('button')).find((b) => b.textContent === label);
  }
  /* A two-step button renames itself once armed, so the second click has to
   * look for either label. */
  function killer(root, label, armedLabel) {
    return Array.from(root.querySelectorAll('button'))
      .find((b) => b.textContent === label || b.textContent === armedLabel);
  }
  function cardFor(title) {
    return Array.from(document.querySelectorAll('.card'))
      .find((c) => c.textContent.indexOf(title) > -1);
  }

  try {
    await tick(200); // render() is async: it reads storage and the shot pixels

    check('no load-time errors', window.__errors.length === 0, window.__errors.join(' | '));
    check('both pages rendered',
      app.textContent.indexOf('Pricing') > -1 && app.textContent.indexOf('About') > -1);
    check('annotations are listed', !!rowFor('Free forever'));

    /* --- editing writes to the user's own field -------------------------- */
    {
      /* A note keeps what the user typed in `text`. */
      const row = rowFor('Nav overlaps at 1280px');
      buttonIn(row, 'Edit').click();
      const ta = row.querySelector('textarea');
      check('Edit opens a field on a note', !!ta);
      check('pre-filled with what was written',
        ta && ta.value === 'Nav overlaps at 1280px', ta && ta.value);
      ta.value = 'Nav overlaps the hero below 1280px';
      ta.dispatchEvent(new Event('blur'));
      await tick(80);

      const a2 = page('https://example.com/pricing').annotations.find((a) => a.id === 'a2');
      check('editing a note saves to its text', a2.text === 'Nav overlaps the hero below 1280px', a2.text);
    }

    {
      /* A highlight's `text` is quoted FROM the page. Editing must reach the
       * COMMENT and leave the quote exactly as the page said it, or the
       * bundle would claim wording that was never there - and the quote
       * anchor that re-finds the passage would stop matching. */
      const row = rowFor('Free forever');
      buttonIn(row, 'Edit').click();
      const ta = row.querySelector('textarea');
      check('Edit on a highlight offers the comment, not the quote',
        ta && ta.value === 'Not true', ta && ta.value);
      ta.value = 'Contradicts the pricing table';
      ta.dispatchEvent(new Event('blur'));
      await tick(80);

      const a1 = page('https://example.com/pricing').annotations.find((a) => a.id === 'a1');
      check('the comment was updated', a1.comment === 'Contradicts the pricing table', a1.comment);
      check('and the quoted page text is untouched', a1.text === 'Free forever', a1.text);
      check('as is the anchor that re-finds it',
        a1.anchor && a1.anchor.quote && a1.anchor.quote.exact === 'Free forever');
    }

    /* --- delete asks first ----------------------------------------------- */
    {
      const row = rowFor('wrong logo');
      const del = buttonIn(row, 'Delete');
      del.click();
      await tick(40);
      check('one click arms rather than deletes',
        !!page('https://example.com/pricing').annotations.find((a) => a.id === 'a3'));
      check('and the button says what the next click will do',
        del.textContent === 'Really delete?', del.textContent);
    }

    /* --- deleting an entry ----------------------------------------------- */
    {
      const before = shotIds();
      check('the fixture starts with every screenshot', before ===
        'sh_about,sh_orphan,sh_shared,sh_solo', before);

      const row = rowFor('wrong logo');
      killer(row, 'Delete', 'Really delete?').click(); // second click: already armed
      await tick(150);

      const anns = page('https://example.com/pricing').annotations;
      check('the entry is gone', !anns.find((a) => a.id === 'a3'));
      check('and the others are untouched', anns.length === 2, String(anns.length));
      check('its screenshot went with it, having nothing else pointing at it',
        shotIds() === 'sh_about,sh_orphan,sh_shared', shotIds());
      check('and so did the pixels, rather than being left in storage',
        pixelKeys() === 'sh_about,sh_orphan,sh_shared', pixelKeys());
    }

    /* --- a screenshot two annotations share ------------------------------- */
    {
      const row = rowFor('Free forever');
      killer(row, 'Delete', 'Really delete?').click();
      killer(row, 'Delete', 'Really delete?').click();
      await tick(150);

      check('the highlight is gone',
        !page('https://example.com/pricing').annotations.find((a) => a.id === 'a1'));
      check('but a screenshot the OTHER annotation still uses survives',
        shotIds().indexOf('sh_shared') > -1, shotIds());
      check('and a screenshot taken on its own is never touched',
        shotIds().indexOf('sh_orphan') > -1, shotIds());
    }

    /* --- deleting a whole page -------------------------------------------- */
    {
      const card = cardFor('About');
      const del = buttonIn(card, 'Delete page');
      check('each page offers Delete page', !!del);
      del.click();
      await tick(40);
      check('deleting a page asks first too',
        !!page('https://example.com/about'));
      killer(cardFor('About'), 'Delete page', 'Delete this page?').click();
      await tick(150);

      check('the page is gone', !page('https://example.com/about'));
      check('the other page is still there', !!page('https://example.com/pricing'));
      check('its screenshots went with it',
        shotIds().indexOf('sh_about') === -1, shotIds());
      check('including the pixels',
        pixelKeys().indexOf('sh_about') === -1, pixelKeys());
      check('and the page is off the screen',
        app.textContent.indexOf('example.com/about') === -1);
    }
  } catch (e) {
    lines.push('FAIL threw after ' + lines.length + ' checks :: ' +
      (e && e.message ? e.message : String(e)));
  }
  flush();
})();
</script>
</body>
</html>
