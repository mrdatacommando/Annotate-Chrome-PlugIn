<html>
<head><meta charset="utf-8"><title>Annotate Tool - review page boot</title></head>
<body>

<!-- The review page's own shell, so its scripts run against the real DOM they
     expect. A bare file:// load of review.html cannot work - it has no chrome
     API - so this harness supplies one, which is also how the page behaves in
     the extension. -->
<div id="app"></div>
<input type="file" id="file" hidden>
<div id="checks">pending</div>

<script>
  window.__errors = [];
  window.onerror = function (m, s, l, c) {
    window.__errors.push(m + ' @' + (s || '?').split('/').pop() + ':' + l + ':' + c);
  };
  const mem = {};
  window.chrome = {
    storage: {
      local: {
        async get(k) {
          if (k === null) return Object.assign({}, mem);
          if (typeof k === 'string') return k in mem ? { [k]: mem[k] } : {};
          return {};
        },
        async set(o) { Object.assign(mem, o); },
        async remove(keys) { (Array.isArray(keys) ? keys : [keys]).forEach(k => delete mem[k]); }
      },
      onChanged: { addListener() {} }
    },
    runtime: { id: 't', async sendMessage() { return { ok: true }; },
               onMessage: { addListener() {} } },
    tabs: { async create() { return { id: 1 }; } },
    downloads: { async download() { return 1; } }
  };
</script>

<script src="../core/store.js"></script>
<script src="../core/zip.js"></script>
<script src="../core/unzip.js"></script>
<script src="../core/report.js"></script>
<script src="../core/lens.js"></script>
<script src="../review/review.js"></script>

<script>
(async function () {
  const lines = [];
  function flush() { document.getElementById('checks').textContent = lines.join('\n'); }
  function check(label, ok, detail) {
    lines.push((ok ? 'PASS ' : 'FAIL ') + label + (detail ? ' :: ' + detail : ''));
    flush();
  }
  const tick = (ms) => new Promise(r => setTimeout(r, ms || 60));

  await tick(150); // let the async boot finish

  check('no load-time errors', window.__errors.length === 0, window.__errors.join(' | '));

  /* The regression this harness exists for: boot() awaits storage, and if that
   * throws the page renders NOTHING with no explanation. It must always reach
   * the drop zone. */
  const app = document.getElementById('app');
  check('the page reached its empty state rather than staying blank',
    app.textContent.indexOf('Open a review bundle') > -1,
    JSON.stringify(app.textContent.slice(0, 60)));
  check('the drop zone offers a file picker',
    app.textContent.indexOf('Choose a ZIP') > -1);

  check('the magnifier module is available to the page', !!(window.AT && AT.lens));
  check('the report module is available to the page', !!(window.AT && AT.report));

  flush();

  /* --- opening a real bundle --------------------------------------------
   *
   * Driven through the file input, because that is the path a reviewer takes.
   * The guard that stops a session starting mid-review reads the stored
   * record, and an earlier version of this feature was tested only by writing
   * that record by hand - which passed happily while NOTHING in the real load
   * path ever wrote it. Opening a bundle and leaving it there recorded no
   * open bundle at all, and a session could still be started. */
  (async function () {
    const tick = (ms) => new Promise((r) => setTimeout(r, ms || 30));
    try {
      const session = {
        id: 's_rp', author: 'Sam', startedAt: '2026-09-06T09:00:00.000Z',
        endedAt: '2026-09-06T09:30:00.000Z', active: false,
        pages: [{
          url: 'https://example.com/pricing', title: 'Pricing',
          viewport: { w: 1280, h: 800, dpr: 2 }, visitedAt: '2026-09-06T09:01:00.000Z',
          annotations: [{
            id: 'a1', type: 'highlight', color: '#f4c430', author: 'Sam',
            text: 'Free forever', comment: 'Not true', unplaced: false,
            createdAt: '2026-09-06T09:02:00.000Z',
            anchor: { kind: 'quote', selector: 'main > p',
                      quote: { prefix: 'is ', exact: 'Free forever', suffix: ' for' } },
            shotId: null, rect: { x: 300, y: 1250, w: 90, h: 18 }
          }]
        }],
        shots: []
      };

      check('nothing is recorded as open before a bundle is loaded',
        !(mem.at_review && mem.at_review.open === true),
        JSON.stringify(mem.at_review || null));

      const built = AT.report.build(session, new Map());
      const blob = AT.zip.create(built.files);
      const file = new File([blob], 'annotate-session-test.zip', { type: 'application/zip' });
      const input = document.getElementById('file');
      const dt = new DataTransfer();
      dt.items.add(file);
      input.files = dt.files;
      input.dispatchEvent(new Event('change'));

      for (let i = 0; i < 40 && !(mem.at_review && mem.at_review.open === true); i++) {
        await tick(50);
      }

      check('the bundle actually opened',
        app.textContent.indexOf('Open a review bundle') === -1,
        JSON.stringify(app.textContent.slice(0, 60)));
      check('LOADING a bundle records it as open, with no interaction at all',
        !!(mem.at_review && mem.at_review.open === true),
        JSON.stringify(mem.at_review || null));
      check('and it names the bundle that is open',
        mem.at_review.bundleName === 'annotate-session-test.zip',
        mem.at_review.bundleName);

      /* Close has to put it back, or the block never lifts. */
      const closeBtn = Array.from(document.querySelectorAll('button'))
        .find((b) => b.textContent === 'Close bundle');
      check('the review page offers Close bundle', !!closeBtn);
      if (closeBtn) {
        closeBtn.click();
        for (let i = 0; i < 40 && mem.at_review && mem.at_review.open !== false; i++) {
          await tick(50);
        }
        check('Close bundle lowers the open flag',
          mem.at_review && mem.at_review.open === false,
          JSON.stringify(mem.at_review || null));
        check('and keeps the record, because it holds the reviewer\'s replies',
          !!mem.at_review && mem.at_review.bundleName === 'annotate-session-test.zip');
        check('and returns the page to the drop zone',
          app.textContent.indexOf('Open a review bundle') > -1);
      }
    } catch (e) {
      lines.push('FAIL threw :: ' + (e && e.message ? e.message : String(e)));
    }
    flush();
  })();
})();
</script>
</body>
</html>
